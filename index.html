<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Quicksand', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    overflow-x: hidden;
    color: white;
}

/* soft glow overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,182,193,0.15), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(173,216,230,0.12), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(144,238,144,0.1), transparent 50%);
    pointer-events: none;
}

/* LANDING */
#landing {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#landing h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ffd6e0, #d6f5ff, #d6ffe0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fade 2s ease;
}

@keyframes fade {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
}

.enter-btn {
    margin-top: 25px;
    padding: 14px 40px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.05);
    color: white;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: 0.3s;
}

.enter-btn:hover {
    transform: scale(1.05);
    border-color: white;
}

/* MAIN */
#main {
    display: none;
    padding: 30px 20px;
}

/* fox */
.fox {
    width: 130px;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

/* title */
.title {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    margin: 20px 0;
    opacity: 0.9;
}

/* message card */
.card {
    max-width: 600px;
    margin: auto;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.1);
    line-height: 1.9;
    font-size: 1rem;
}

/* hearts */
.heart {
    position: absolute;
    font-size: 26px;
    cursor: pointer;
    transition: 0.3s;
}

.heart:hover {
    transform: scale(1.3);
}

/* hidden msg */
#secret {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,182,193,0.15);
}

/* butterflies */
.butterfly {
    position: fixed;
    width: 35px;
    opacity: 0.6;
    animation: fly 18s linear infinite;
}

@keyframes fly {
    from {transform: translateX(-10vw);}
    to {transform: translateX(110vw);}
}

/* particles */
.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.3;
    animation: rise 12s linear infinite;
}

@keyframes rise {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}

/* music button */
.music {
    position: fixed;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>

<body>

<audio id="song" loop>
  <source src="song.mp3">
</audio>

<!-- LANDING -->
<div id="landing">
    <h1>FOR YOU</h1>
    <button class="enter-btn" onclick="start()">Enter 💖</button>
</div>

<!-- MAIN -->
<div id="main">

<button class="music" onclick="document.getElementById('song').play()">🎵</button>

<img class="fox" src="https://cdn-icons-png.flaticon.com/512/616/616554.png">

<div class="title">My Love</div>

<div class="card">
    Thank you for being mine.. 💖<br><br>
    I'll be rooting for you in every lifetime..<br>
    I'm so proud of you, always.<br><br>
    You feel like home in every universe 🦋<br><br>
    I love you endlessly.
</div>

<div id="secret">
    lets go bingchun soon and play mortal combat 💕
</div>

</div>

<script>

function start(){
    document.getElementById("landing").style.display="none";
    document.getElementById("main").style.display="block";

    spawnHearts();
    butterflies();
    particles();
}

/* hearts game */
let count=0;

function spawnHearts(){
    setInterval(()=>{
        let h=document.createElement("div");
        h.className="heart";
        h.innerHTML="💖";
        h.style.left=Math.random()*90+"vw";
        h.style.top=Math.random()*80+"vh";

        h.onclick=()=>{
            h.remove();
            count++;
            if(count>=5){
                document.getElementById("secret").style.display="block";
            }
        };

        document.body.appendChild(h);

        setTimeout(()=>h.remove(),5000);
    },900);
}

/* butterflies */
function butterflies(){
    setInterval(()=>{
        let b=document.createElement("img");
        b.src="https://cdn-icons-png.flaticon.com/512/616/616490.png";
        b.className="butterfly";
        b.style.top=Math.random()*80+"vh";
        document.body.appendChild(b);
        setTimeout(()=>b.remove(),18000);
    },3000);
}

/* particles */
function particles(){
    for(let i=0;i<25;i++){
        let p=document.createElement("div");
        p.className="particle";
        p.style.left=Math.random()*100+"vw";
        p.style.animationDuration=(8+Math.random()*5)+"s";
        document.body.appendChild(p);
    }
}

</script>

</body>
</html>
