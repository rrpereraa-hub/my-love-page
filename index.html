<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 25%, #3d2352 50%, #4a2d5c 75%, #1a1a2e 100%);
    background-size: 400% 400%;
    animation: gradientFlow 20s ease infinite;
    color: #e0e0e0;
    overflow-x: hidden;
    min-height: 100vh;
}

@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating Flowers */
.flower {
    position: fixed;
    font-size: 35px;
    opacity: 0;
    animation: floatFlower 15s infinite;
    z-index: 5;
    pointer-events: none;
}

@keyframes floatFlower {
    0% {
        transform: translateY(100vh) rotate(0deg) translateX(0);
        opacity: 0;
    }
    10% {
        opacity: 0.6;
    }
    90% {
        opacity: 0.6;
    }
    100% {
        transform: translateY(-100vh) rotate(360deg) translateX(50px);
        opacity: 0;
    }
}

/* Sparkle Effect */
.sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: radial-gradient(circle, #ffd6f0 0%, #c084fc 100%);
    border-radius: 50%;
    pointer-events: none;
    animation: sparkleFloat 3s ease-in-out infinite;
    z-index: 3;
}

@keyframes sparkleFloat {
    0%, 100% {
        opacity: 0;
        transform: translateY(0) scale(0);
    }
    50% {
        opacity: 1;
        transform: translateY(-20px) scale(1);
    }
}

/* Landing Page */
#landing {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 10;
}

#landing h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 5em;
    color: #ffd6f0;
    margin-bottom: 60px;
    text-shadow: 0 0 30px rgba(255, 214, 240, 0.5);
    animation: titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow {
    0%, 100% {
        text-shadow: 0 0 20px rgba(255, 214, 240, 0.4);
    }
    50% {
        text-shadow: 0 0 40px rgba(255, 214, 240, 0.8), 0 0 60px rgba(192, 132, 252, 0.4);
    }
}

.enter-btn {
    padding: 18px 70px;
    background: transparent;
    border: 2px solid rgba(255, 214, 240, 0.6);
    color: #ffd6f0;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    font-weight: 400;
    position: relative;
    overflow: hidden;
}

.enter-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 214, 240, 0.2), transparent);
    transition: left 0.6s ease;
}

.enter-btn:hover::before {
    left: 100%;
}

.enter-btn:hover {
    border-color: #ffd6f0;
    box-shadow: 0 0 30px rgba(255, 214, 240, 0.4);
    transform: translateY(-2px);
}

/* Main Content */
#main {
    display: none;
    padding: 60px 20px;
    position: relative;
    z-index: 10;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Music Button */
.music-btn {
    position: fixed;
    top: 40px;
    right: 40px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 2px solid rgba(255, 214, 240, 0.4);
    background: rgba(45, 27, 61, 0.7);
    backdrop-filter: blur(10px);
    color: #ffd6f0;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.music-btn:hover {
    border-color: #ffd6f0;
    box-shadow: 0 0 25px rgba(255, 214, 240, 0.4);
    transform: scale(1.08);
}

/* Content Wrapper */
.content-wrapper {
    max-width: 900px;
    margin: 0 auto;
}

/* Typed Text */
#typedText {
    font-family: 'Playfair Display', serif;
    font-size: 3.2em;
    font-weight: 400;
    color: #ffd6f0;
    text-align: center;
    margin: 40px 0 60px;
    letter-spacing: 2px;
    min-height: 90px;
}

.cursor {
    opacity: 1;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}

/* Message Box */
.message-box {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 214, 240, 0.15);
    padding: 60px;
    border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    animation: slideUp 1.5s ease;
    position: relative;
}

.message-box::before {
    content: '✦';
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 20px;
    color: #c084fc;
    opacity: 0.3;
}

.message-box::after {
    content: '✦';
    position: absolute;
    bottom: 20px;
    right: 30px;
    font-size: 20px;
    color: #c084fc;
    opacity: 0.3;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-box p {
    font-size: 1.15em;
    line-height: 2.2;
    color: rgba(255, 255, 255, 0.85);
    margin: 25px 0;
    font-weight: 300;
    letter-spacing: 0.5px;
}

.message-box .signature {
    display: block;
    margin-top: 50px;
    font-family: 'Great Vibes', cursive;
    font-size: 1.8em;
    color: #ffd6f0;
    letter-spacing: 1px;
}

/* Interactive Hearts */
.heart-interactive {
    position: fixed;
    font-size: 45px;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s ease;
    color: #ffd6f0;
    text-shadow: 0 0 15px rgba(255, 214, 240, 0.6);
    animation: heartPulse 2s ease-in-out infinite;
}

@keyframes heartPulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.1);
    }
}

.heart-interactive:hover {
    transform: scale(1.3) rotate(15deg);
    color: #ff6ec7;
    text-shadow: 0 0 30px rgba(255, 110, 199, 0.8);
}

/* Firework Effect */
.firework {
    position: fixed;
    pointer-events: none;
    z-index: 200;
}

.firework-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--x), var(--y)) scale(0);
        opacity: 0;
    }
}

/* Love Message Popup */
.love-message {
    position: fixed;
    font-family: 'Playfair Display', serif;
    font-size: 1.3em;
    color: #ffd6f0;
    text-shadow: 0 0 20px rgba(255, 214, 240, 0.8);
    z-index: 250;
    pointer-events: none;
    font-weight: 400;
    letter-spacing: 1px;
    animation: messageFloat 2s ease-out forwards;
}

@keyframes messageFloat {
    0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
    }
    20% {
        opacity: 1;
        transform: translateY(-20px) scale(1);
    }
    80% {
        opacity: 1;
        transform: translateY(-80px) scale(1);
    }
    100% {
        opacity: 0;
        transform: translateY(-120px) scale(0.8);
    }
}

/* Heart Counter */
.heart-counter {
    position: fixed;
    top: 40px;
    left: 40px;
    font-size: 1.1em;
    color: #ffd6f0;
    background: rgba(45, 27, 61, 0.7);
    backdrop-filter: blur(10px);
    padding: 15px 28px;
    border-radius: 30px;
    border: 1px solid rgba(255, 214, 240, 0.3);
    z-index: 1000;
    font-weight: 300;
    letter-spacing: 1px;
}

/* Instructions */
.instructions {
    text-align: center;
    font-size: 0.95em;
    color: rgba(255, 214, 240, 0.7);
    margin: 40px 0;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
}

/* Secret Message */
#secretMsg {
    display: none;
    background: linear-gradient(135deg, rgba(192, 132, 252, 0.15) 0%, rgba(255, 110, 199, 0.15) 100%);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 214, 240, 0.3);
    padding: 45px;
    border-radius: 3px;
    margin: 50px auto;
    max-width: 700px;
    text-align: center;
    animation: reveal 1.2s ease;
    box-shadow: 0 20px 60px rgba(192, 132, 252, 0.2);
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(0.8) rotateX(-90deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotateX(0deg);
    }
}

#secretMsg p {
    font-family: 'Playfair Display', serif;
    font-size: 1.4em;
    color: #ffd6f0;
    line-height: 1.8;
    font-weight: 400;
    letter-spacing: 1px;
}

/* Butterflies */
.butterfly {
    position: fixed;
    width: 45px;
    height: 45px;
    z-index: 10;
    opacity: 0.5;
    animation: butterflyFlight 25s linear infinite;
    pointer-events: none;
}

@keyframes butterflyFlight {
    0% {
        transform: translateX(-10vw) translateY(0);
    }
    25% {
        transform: translateX(30vw) translateY(-35vh);
    }
    50% {
        transform: translateX(60vw) translateY(25vh);
    }
    75% {
        transform: translateX(90vw) translateY(-20vh);
    }
    100% {
        transform: translateX(110vw) translateY(0);
    }
}

/* Responsive */
@media (max-width: 768px) {
    #landing h1 {
        font-size: 3.5em;
    }
    
    #typedText {
        font-size: 2.2em;
    }
    
    .message-box {
        padding: 40px 30px;
    }
    
    .music-btn, .heart-counter {
        top: 20px;
    }
    
    .music-btn {
        right: 20px;
    }
    
    .heart-counter {
        left: 20px;
        font-size: 0.95em;
    }
}
</style>
</head>

<body>

<!-- Audio -->
<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- Landing Page -->
<div id="landing">
    <h1>For You</h1>
    <button class="enter-btn" onclick="start()">Enter</button>
</div>

<!-- Main Content -->
<div id="main">
    <button class="music-btn" onclick="toggleMusic()" id="musicBtn">♪</button>
    
    <div class="heart-counter">
        <span id="heartCount">0</span> / 5
    </div>

    <div class="content-wrapper">
        <h2 id="typedText"></h2>

        <div class="message-box">
            <p>Thank you for being mine.</p>
            
            <p>I'll be rooting for you in every lifetime. I'm so proud of you, chuti bba.</p>

            <p>You are my safe place, my happiness. I'd find you in every universe.</p>

            <p>I love you.</p>

            <span class="signature">from your jandi</span>
        </div>

        <p class="instructions">Catch the hearts</p>
        
        <div id="secretMsg">
            <p>Let's go bingchun soon and play mortal kombat 💕</p>
        </div>
    </div>
</div>

<script>
let musicPlaying = false;

// Love messages that appear when clicking hearts
const loveMessages = [
    "You're my everything",
    "Forever yours",
    "My heart is yours",
    "You complete me",
    "Endless love",
    "Always & forever",
    "You're my sunshine",
    "My soulmate",
    "Love you infinitely",
    "You're my world",
    "My one and only",
    "Together always",
    "You're my dream",
    "Pure love",
    "My better half"
];

function start() {
    document.getElementById("landing").style.display = "none";
    document.getElementById("main").style.display = "block";
    
    typing();
    createSparkles();
    createFloatingFlowers();
    createButterflies();
    spawnHearts();
}

function toggleMusic() {
    const music = document.getElementById("music");
    const btn = document.getElementById("musicBtn");
    
    if (musicPlaying) {
        music.pause();
        btn.innerHTML = "♪";
        musicPlaying = false;
    } else {
        music.play().catch(e => console.log("Click to play music"));
        btn.innerHTML = "⏸";
        musicPlaying = true;
    }
}

// Typing Effect
let text = "My Love";
let i = 0;
function typing() {
    if (i < text.length) {
        document.getElementById("typedText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 200);
    } else {
        document.getElementById("typedText").innerHTML += '<span class="cursor">_</span>';
    }
}

// Create Sparkles
function createSparkles() {
    setInterval(() => {
        let sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = Math.random() * 100 + "vw";
        sparkle.style.top = Math.random() * 100 + "vh";
        sparkle.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 3000);
    }, 300);
}

// Floating Flowers
function createFloatingFlowers() {
    const flowers = ["🌸", "🌺", "🌷", "🏵️", "💮"];
    setInterval(() => {
        let flower = document.createElement("div");
        flower.className = "flower";
        flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDelay = "0s";
        flower.style.animationDuration = (12 + Math.random() * 8) + "s";
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 15000);
    }, 2500);
}

// Butterflies
function createButterflies() {
    setInterval(() => {
        let butterfly = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        butterfly.setAttribute("class", "butterfly");
        butterfly.setAttribute("viewBox", "0 0 50 50");
        butterfly.style.top = Math.random() * 80 + "vh";
        
        butterfly.innerHTML = `
            <ellipse cx="15" cy="20" rx="12" ry="8" fill="rgba(255, 214, 240, 0.4)">
                <animate attributeName="ry" values="8;12;8" dur="0.6s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="35" cy="20" rx="12" ry="8" fill="rgba(255, 214, 240, 0.4)">
                <animate attributeName="ry" values="8;12;8" dur="0.6s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="15" cy="30" rx="10" ry="6" fill="rgba(192, 132, 252, 0.3)">
                <animate attributeName="ry" values="6;9;6" dur="0.6s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="35" cy="30" rx="10" ry="6" fill="rgba(192, 132, 252, 0.3)">
                <animate attributeName="ry" values="6;9;6" dur="0.6s" repeatCount="indefinite"/>
            </ellipse>
            <line x1="25" y1="15" x2="25" y2="35" stroke="rgba(255, 214, 240, 0.5)" stroke-width="1.5"/>
        `;
        
        document.body.appendChild(butterfly);
        setTimeout(() => butterfly.remove(), 25000);
    }, 4000);
}

// Create Firework Effect
function createFirework(x, y) {
    const colors = ['#ffd6f0', '#ff6ec7', '#c084fc', '#a855f7', '#ff8fd4'];
    const particles = 30;
    
    for (let i = 0; i < particles; i++) {
        const particle = document.createElement("div");
        particle.className = "firework-particle";
        particle.style.left = x + "px";
        particle.style.top = y + "px";
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.background = color;
        particle.style.boxShadow = `0 0 10px ${color}`;
        
        const angle = (Math.PI * 2 * i) / particles;
        const velocity = 80 + Math.random() * 40;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;
        
        particle.style.setProperty('--x', tx + 'px');
        particle.style.setProperty('--y', ty + 'px');
        
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
    }
}

// Show Love Message
function showLoveMessage(x, y) {
    const message = document.createElement("div");
    message.className = "love-message";
    message.innerHTML = loveMessages[Math.floor(Math.random() * loveMessages.length)];
    message.style.left = x + "px";
    message.style.top = y + "px";
    document.body.appendChild(message);
    setTimeout(() => message.remove(), 2000);
}

// Hearts Game
let heartCount = 0;
function spawnHearts() {
    setInterval(() => {
        if (heartCount >= 5) return;
        
        let heart = document.createElement("div");
        heart.className = "heart-interactive";
        heart.innerHTML = "♡";
        heart.style.left = Math.random() * 85 + "vw";
        heart.style.top = Math.random() * 75 + "vh";
        
        heart.onclick = (e) => {
            const rect = heart.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            // Create firework
            createFirework(x, y);
            
            // Show love message
            showLoveMessage(x, y);
            
            // Remove heart
            heart.style.animation = "none";
            heart.style.transition = "all 0.3s ease";
            heart.style.transform = "scale(0)";
            heart.style.opacity = "0";
            
            heartCount++;
            document.getElementById("heartCount").textContent = heartCount;
            
            setTimeout(() => heart.remove(), 300);
            
            if (heartCount >= 5) {
                setTimeout(() => {
                    document.getElementById("secretMsg").style.display = "block";
                    document.querySelector(".instructions").style.display = "none";
                }, 500);
            }
        };
        
        document.body.appendChild(heart);
        
        setTimeout(() => {
            if (heart.parentElement && heartCount < 5) {
                heart.style.transition = "all 0.5s ease";
                heart.style.opacity = "0";
                setTimeout(() => heart.remove(), 500);
            }
        }, 5000);
    }, 1800);
}
</script>

</body>
</html>
