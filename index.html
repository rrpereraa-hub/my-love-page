<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #e6fff2, #ffe6f2, #e6f0ff);
    overflow-x: hidden;
    text-align: center;
}

/* landing */
#landing {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

button {
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    background: #ff99cc;
    color: white;
    font-size: 16px;
}

/* main */
#main {
    display: none;
    padding: 20px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 20px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

/* fox */
.fox {
    width: 120px;
    animation: float 3s ease-in-out infinite;
}

/* butterfly */
.butterfly {
    position: fixed;
    width: 40px;
    animation: fly 10s linear infinite;
}

@keyframes fly {
    from {transform: translateX(-10vw);}
    to {transform: translateX(110vw);}
}

/* floating animation */
@keyframes float {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

/* hearts */
.heart {
    position: absolute;
    font-size: 30px;
}

/* particles */
.sparkle {
    position: fixed;
    color: white;
    animation: sparkle 3s infinite;
}
@keyframes sparkle {
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

/* hidden msg */
#secretMsg {
    display: none;
    color: #ff66a3;
    margin-top: 20px;
}

/* typing effect */
#typedText {
    font-family: 'Pacifico', cursive;
    color: #ff6699;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="song.mp3">
</audio>

<div id="landing">
    <h1>Hey you 🦊🦋</h1>
    <button onclick="start()">Enter 💖</button>
</div>

<div id="main">

<button onclick="playMusic()">🎵 Play Music</button>

<img class="fox" src="https://cdn-icons-png.flaticon.com/512/616/616554.png">

<h2 id="typedText"></h2>

<div class="box">
<p>
Thank you for being mine.. 💖<br>
I'll be rooting for you in every lifetime..<br>
I'm sooo proud proud of you chuti bba 🥺
</p>

<p>
You are my safe place, my happiness 🌸<br>
I'd find you in every universe 🦋
</p>

<p>I love youuu 💕</p>

<b>— from your jandi 💌</b>
</div>

<h3>Tap hearts 💖</h3>
<div id="secretMsg">
lets go bingchun soon and play mortal combat 💕
</div>

</div>

<script>

function start(){
    document.getElementById("landing").style.display="none";
    document.getElementById("main").style.display="block";
    typing();
    butterflies();
    sparkles();
    heartsGame();
}

function playMusic(){
    document.getElementById("music").play();
}

/* typing */
let text="My Love 💌";
let i=0;
function typing(){
    if(i<text.length){
        document.getElementById("typedText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing,100);
    }
}

/* butterflies */
function butterflies(){
    setInterval(()=>{
        let b=document.createElement("img");
        b.src="https://cdn-icons-png.flaticon.com/512/616/616490.png";
        b.className="butterfly";
        b.style.top=Math.random()*80+"vh";
        document.body.appendChild(b);
        setTimeout(()=>b.remove(),10000);
    },2000);
}

/* sparkles */
function sparkles(){
    setInterval(()=>{
        let s=document.createElement("div");
        s.className="sparkle";
        s.innerHTML="✨";
        s.style.left=Math.random()*100+"vw";
        s.style.top=Math.random()*100+"vh";
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),3000);
    },300);
}

/* hearts game */
let count=0;
function heartsGame(){
    setInterval(()=>{
        let h=document.createElement("div");
        h.className="heart";
        h.innerHTML="💖";
        h.style.left=Math.random()*90+"vw";
        h.style.top=Math.random()*80+"vh";

        h.onclick=()=>{
            h.remove();
            count++;
            if(count>=5){
                document.getElementById("secretMsg").style.display="block";
            }
        };

        document.body.appendChild(h);
        setTimeout(()=>h.remove(),4000);
    },800);
}

</script>

</body>
</html>
